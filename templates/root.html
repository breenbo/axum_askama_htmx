<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script
      src="https://cdn.jsdelivr.net/npm/htmx.org@2.0.11/dist/htmx.min.js"
      integrity="sha384-2OatzQy1H+Zd/IIrjr1TcuDGqLXeHhbooAyJY1KdQMKnr4LZ22k31GBLdYKHmVjg"
      crossorigin="anonymous"
    ></script>
    <title>{% block title %}{{title}}{% endblock %}</title>
  </head>
  <body class="bg-neutral-700 p-6 max-w-xl mx-auto text-sm">
    <h1 id="content" class="text-2xl text-white">
      {% block content %} {{ some_data }} {% endblock %}
    </h1>
  </body>
</html>
