{% extends "../base.html" %} {% block content %}
<form method="POST" action="/ideas/{{idea.id}}/edit">
  <legend>Come on, have an idea</legend>
  <textarea
    class="mt-3 h-24 w-full bg-white/5"
    placeholder="Awesome new idea"
    id="description"
    name="description"
  >
{{ idea.description }}</textarea>

  {% if let Some(err_msg) = error %}
  <p class="text-red-300 text-sm mt-1">{{ err_msg }}</p>
  {% endif %}

  <div class="mt-6 flex items-center gap-x-4">
    <button
      type="submit"
      class="rounded-md bg-indigo-500 text-white px-3 py-2 text-sm font-semibold cursor-pointer"
    >
      Update
    </button>
    <button
      type="submit"
      form="delete-idea-form"
      class="rounded-md bg-red-500 text-white px-3 py-2 text-sm font-semibold cursor-pointer"
    >
      Delete
    </button>
  </div>
</form>
<form id="delete-idea-form" method="POST" action="/ideas/{{idea.id}}/delete"></form>
{% endblock %}
