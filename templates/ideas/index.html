{% extends "../base.html" %} {% block content %}
  {% if ideas.len() > 0 %}
  <div class="pb-10">
    <div class="mt-8">
      <h2 class="text-4xl mb-6">
        {{title}}
      </h2>

      <div class="grid grid-cols-2 gap-4">
        {% for idea in ideas %}
            <a href="/ideas/{{idea.id}}" class="card bg-white shadow-sm border border-neutral-200 hover:border-neutral-400">
                <div class="card-body">
                    <h2 class="card-title">{{ idea.description }}</h2>
                </div>
            </a>
        {% endfor %}
      </div>
    </div>
    <a href="/ideas/create">
      <div class="mt-8 text-xl text-blue-700 ">
        Go create awesome ideas
      </div>
    </a>
  </div>
  {% endif %}
{% endblock %}
