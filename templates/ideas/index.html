{% extends "../base.html" %} {% block content %}
  <a href="/ideas/create"><h2 class="text-xl text-blue-300">Go create awesome ideas</h2></a>

  {% if ideas.len() > 0 %}
    <div class="mt-8">
      <h2 class="text-xl">
          Already awesome ideas
      </h2>

      <ul class="text-sm">
        {% for idea in ideas %}
        <li>
          <a href="/ideas/{{idea.id}}">{{ idea.description }}</a>
        </li>
        {% endfor %}
      </ul>
    </div>
  {% endif %}
{% endblock %}
