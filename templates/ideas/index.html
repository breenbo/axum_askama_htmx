{% extends "../base.html" %} {% block content %}
  <form method="POST" action="/ideas">
    <legend>Come on, have an idea</legend>
    <textarea
      class="mt-3 h-24 w-full bg-white/5"
      placeholder="Awesome new idea"
      id="idea"
      name="idea"
    ></textarea>

    <div class="mt-6">
      <button
        type="submit"
        class="rounded-md bg-indigo-500 text-white px-3 py-2 text-sm font-semibold cursor-pointer"
      >
        Save
      </button>
    </div>
  </form>

  {% if ideas.len() > 0 %}
    <div class="mt-8">
      <h2 class="text-xl">
          Already awesome ideas
      </h2>

      <ul class="text-sm">
        {% for idea in ideas %}
        <li>
          <a href="/ideas/{{idea.id}}">{{ idea.description }}</a>
        </li>
        {% endfor %}
      </ul>
    </div>
  {% endif %}
{% endblock %}
