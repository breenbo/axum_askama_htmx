{% extends "../base.html" %} {% block content %}
<form method="POST" action="/ideas">
  <div class="text-4xl mb-6">
    {{title}}
  </div>

  <legend>Come on dude, have an idea</legend>
  <textarea
    class="textarea w-full mt-2"
    placeholder="Awesome new idea"
    id="description"
    name="description"
  >
{{description}}</textarea>

  {% if let Some(err_msg) = error %}
  <p class="text-red-300 text-sm mt-1">{{ err_msg }}</p>
  {% endif %}

  <div class="mt-6">
    <button
      type="submit"
      class="btn btn-primary"
    >
      Save
    </button>
  </div>
</form>
{% endblock %}
