{% extends "root.html" %} {% block content %}
<div class="text-white">
  <div class="text-4xl mb-6">Ideas</div>

  <form method="POST" action="/ideas">
    <legend>Come on, have an idea</legend>
    <textarea
      class="mt-3 h-24 w-full bg-white/5"
      placeholder="Awesome new idea"
      id="idea"
      name="idea"
    ></textarea>

    <div class="mt-6">
      <button
        type="submit"
        class="rounded-md bg-indigo-500 text-white px-3 py-2 text-sm font-semibold cursor-pointer"
      >
        Save
      </button>
    </div>
  </form>

  {% if ideas.len() > 0 %}
    <div class="mt-8">
      <h2 class="text-xl">
          Already awesome ideas
      </h2>

      <li class="text-sm">
        {% for idea in ideas %}
        <ul>
          {{ idea }}
        </ul>
        {% endfor %}
      </li>
    </div>
  {% endif %}
</div>
{% endblock %}
