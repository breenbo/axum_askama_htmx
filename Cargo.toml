[package]
name = "axum_askama_htmx"
version = "0.1.0"
edition = "2024"

[dependencies]
# core
axum = { version = "0.8.9", features = ["macros"] }
tokio = { version = "1.53.3", features = ["full"] }
tower-sessions = "0.15.0"
# static html template, server side
askama = "0.16.1"
# work with json
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
# manage db
sqlx = { version = "0.9.0", features = [
  "sqlite",
  "runtime-tokio",
  "tls-rustls",
] }
#tracing logs
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
# validate requests
validator = { version = "0.21.0", features = ["derive"] }
# hash password
argon2 = "0.6.0"
password-hash = { version = "0.6.1", features = ["rand_core"] }
rand_core = "0.10.1"
# better error management
thiserror = "2.0.21"
anyhow = "1.0.104"
